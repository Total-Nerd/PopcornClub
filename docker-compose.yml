services:
  db:
    image: postgres:15-alpine
    container_name: tvtracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvtracker
      POSTGRES_PASSWORD: tvtracker_password
      POSTGRES_DB: tvtracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tvtracker-backend
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PORT: 3001
      JWT_SECRET: "${JWT_SECRET}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
      APP_DOMAIN: "${APP_DOMAIN}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
    depends_on:
      - db
    volumes:
      - ${MOVIES_DIR}:/movies:ro
      - ${MOVIES_4K_DIR}:/4k_movies:ro
      - ${DOCS_DIR}:/documentaries:ro
      - ${TV_SHOWS_DIR}:/tv:ro
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: tvtracker-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads-data:
